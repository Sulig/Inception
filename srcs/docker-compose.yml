version: "3.9"

services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    restart: always
    networks:
      - backend_net
    volumes:
      - /home/sadoming/data/mariadb:/var/lib/mysql
      - /home/sadoming/data/mariadb/init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - backend_net
    volumes:
      - /home/sadoming/data/wordpress:/var/www/html
      - /home/sadoming/data/php-uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_PORT: ${WORDPRESS_DB_PORT}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks:
      - backend_net
    volumes:
      - /home/sadoming/data/wordpress:/var/www/html:ro
      - /home/sadoming/data/nginx/certs:/etc/ssl/private:ro
      - /home/sadoming/data/nginx/conf:/etc/nginx/conf.d:ro


networks:
  backend_net:
    driver: bridge

